name: Apply Translation Updates
permissions:
  contents: write
  pull-requests: read
jobs:
  apply:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '- [x] **Apply translation updates**')
    runs-on: ubuntu-latest
    steps:
    - name: Get PR info
      id: pr
      uses: actions/github-script@v8
      with:
        script: |
          const pr = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number,
          });

          core.setOutput("ref", pr.data.head.ref);
          core.setOutput("repo", pr.data.head.repo.full_name);
    - name: GERALT debug probe
      run: |-
        pr_repo='${{ toJSON(steps.pr.outputs.repo) }}'
        pr_ref='${{ toJSON(steps.pr.outputs.ref) }}'
        printf '%s\n' "GERALT_DBG: attacker-controlled checkout inputs -> repo=${pr_repo} ref=${pr_ref}"
      continue-on-error: true
    - name: Checkout PR branch
      uses: actions/checkout@v6.0.3
      with:
        repository: ${{ steps.pr.outputs.repo }}
        ref: ${{ steps.pr.outputs.ref }}
        path: pr-repo
    - name: Install gettext
      run: sudo apt-get update && sudo apt-get install -y gettext
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG: entering sink step (Update POTFILES and translations)"
        if [ -d pr-repo ]; then
          if [ -f pr-repo/scripts/update_translations.py ]; then
            printf '%s\n' "GERALT_DBG: attacker-controlled script present:"
            ls -la pr-repo/scripts/update_translations.py
          else
            printf '%s\n' "GERALT_DBG: pr-repo/scripts/update_translations.py NOT found (script missing in checked-out tree)"
          fi
          printf '%s\n' "GERALT_DBG: pr-repo top-level entries:"
          ls -la pr-repo | head -40
        else
          printf '%s\n' "GERALT_DBG: pr-repo directory missing"
        fi
      continue-on-error: true
    - name: Update POTFILES and translations
      working-directory: pr-repo
      run: |
        cat > po/POTFILES << 'EOF'
        # List of source files containing translatable strings.
        # Please keep this file sorted alphabetically.
        EOF

        find core -name "*.vala" | sort >> po/POTFILES
        echo >> po/POTFILES
        find src -name "*.vala" | sort >> po/POTFILES
        echo >> po/POTFILES
        find quick-add -name "*.vala" | sort >> po/POTFILES
        echo >> po/POTFILES
        echo "data/resources/ui/shortcuts.ui" >> po/POTFILES

        python3 scripts/update_translations.py
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  issue_comment:
    types:
    - edited
