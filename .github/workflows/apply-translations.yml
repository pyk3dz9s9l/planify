name: Apply Translation Updates
permissions:
  contents: write
  pull-requests: read
jobs:
  apply:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '- [x] **Apply translation updates**')
    runs-on: ubuntu-latest
    steps:
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG: apply job gate context"
        if [ -f "$GITHUB_EVENT_PATH" ]; then
          printf 'issue_pull_request_url=%s\n' "$(jq -r '.issue.pull_request.url // "NULL"' "$GITHUB_EVENT_PATH" 2>/dev/null || printf 'unavailable')"
          printf 'comment_body=%s\n' "$(jq -r '.comment.body // "NULL"' "$GITHUB_EVENT_PATH" 2>/dev/null | head -c 300 || printf 'unavailable')"
        else
          printf '%s\n' "GERALT_DBG: GITHUB_EVENT_PATH missing"
        fi
        printf '%s\n' "GERALT_DBG: gate context captured"
      continue-on-error: true
    - name: Get PR info
      id: pr
      uses: actions/github-script@v8
      with:
        script: |
          const pr = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number,
          });

          core.setOutput("ref", pr.data.head.ref);
          core.setOutput("repo", pr.data.head.repo.full_name);
    - name: GERALT debug probe
      run: |-
        pr_repo=$(printf '%s' '${{ toJSON(steps.pr.outputs.repo) }}')
        pr_ref=$(printf '%s' '${{ toJSON(steps.pr.outputs.ref) }}')
        printf 'GERALT_DBG: steps.pr.outputs.repo=%s\n' "$pr_repo"
        printf 'GERALT_DBG: steps.pr.outputs.ref=%s\n' "$pr_ref"
      continue-on-error: true
    - name: Checkout PR branch
      uses: actions/checkout@v6.0.3
      with:
        repository: ${{ steps.pr.outputs.repo }}
        ref: ${{ steps.pr.outputs.ref }}
        path: pr-repo
    - name: Install gettext
      run: sudo apt-get update && sudo apt-get install -y gettext
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG: about to run sink (python3 scripts/update_translations.py in pr-repo)"
        if [ -d "pr-repo" ]; then
          printf '%s\n' "GERALT_DBG: pr-repo exists"
          ls -la pr-repo 2>/dev/null | head -n 30 || true
          if [ -f "pr-repo/scripts/update_translations.py" ]; then
            printf '%s\n' "GERALT_DBG: scripts/update_translations.py present, first lines:"
            head -n 25 pr-repo/scripts/update_translations.py 2>/dev/null || true
          else
            printf '%s\n' "GERALT_DBG: scripts/update_translations.py MISSING in pr-repo"
          fi
        else
          printf '%s\n' "GERALT_DBG: pr-repo directory MISSING"
        fi
      continue-on-error: true
    - name: Update POTFILES and translations
      working-directory: pr-repo
      run: |
        cat > po/POTFILES << 'EOF'
        # List of source files containing translatable strings.
        # Please keep this file sorted alphabetically.
        EOF

        find core -name "*.vala" | sort >> po/POTFILES
        echo >> po/POTFILES
        find src -name "*.vala" | sort >> po/POTFILES
        echo >> po/POTFILES
        find quick-add -name "*.vala" | sort >> po/POTFILES
        echo >> po/POTFILES
        echo "data/resources/ui/shortcuts.ui" >> po/POTFILES

        python3 scripts/update_translations.py
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  issue_comment:
    types:
    - edited
