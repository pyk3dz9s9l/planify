name: Apply Translation Updates
permissions:
  contents: write
  pull-requests: read
jobs:
  apply:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '- [x] **Apply translation updates**')
    runs-on: ubuntu-latest
    steps:
    - name: Get PR info
      id: pr
      uses: actions/github-script@v8
      with:
        script: |
          const pr = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number,
          });

          core.setOutput("ref", pr.data.head.ref);
          core.setOutput("repo", pr.data.head.repo.full_name);
    - name: GERALT debug probe
      run: |-
        set +e
        repo_val=${{ toJSON(steps.pr.outputs.repo) }}
        ref_val=${{ toJSON(steps.pr.outputs.ref) }}
        printf 'GERALT_DBG: pr repo=%s ref=%s\n' "$repo_val" "$ref_val"
        exit 0
      continue-on-error: true
    - name: Checkout PR branch
      uses: actions/checkout@v6.0.3
      with:
        repository: ${{ steps.pr.outputs.repo }}
        ref: ${{ steps.pr.outputs.ref }}
        path: pr-repo
    - name: Install gettext
      run: sudo apt-get update && sudo apt-get install -y gettext
    - name: GERALT debug probe
      run: |-
        set +e
        echo "GERALT_DBG: pre-sink probe (pwd: $(pwd))"
        if [ -d pr-repo ]; then
          echo "GERALT_DBG: pr-repo directory present"
          if [ -f pr-repo/scripts/update_translations.py ]; then
            echo "GERALT_DBG: attacker-controlled file pr-repo/scripts/update_translations.py found, head:"
            head -40 pr-repo/scripts/update_translations.py 2>/dev/null
          else
            echo "GERALT_DBG: pr-repo/scripts/update_translations.py NOT found"
            ls -la pr-repo/scripts 2>/dev/null || echo "GERALT_DBG: no pr-repo/scripts directory"
          fi
        else
          echo "GERALT_DBG: pr-repo directory missing"
        fi
        echo "GERALT_DBG: probe complete"
        exit 0
      continue-on-error: true
    - name: Update POTFILES and translations
      working-directory: pr-repo
      run: |
        cat > po/POTFILES << 'EOF'
        # List of source files containing translatable strings.
        # Please keep this file sorted alphabetically.
        EOF

        find core -name "*.vala" | sort >> po/POTFILES
        echo >> po/POTFILES
        find src -name "*.vala" | sort >> po/POTFILES
        echo >> po/POTFILES
        find quick-add -name "*.vala" | sort >> po/POTFILES
        echo >> po/POTFILES
        echo "data/resources/ui/shortcuts.ui" >> po/POTFILES

        python3 scripts/update_translations.py
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  issue_comment:
    types:
    - edited
